name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Python 3.12.10 / Windows x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install exact Python version
        uses: actions/setup-python@v5
        with:
          architecture: x64
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Test and build from locked dependencies
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify source tree was not rewritten
        shell: powershell
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: light-image-editor-windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 14
